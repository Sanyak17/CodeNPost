<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeNPost</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="terminal">
    <div class="terminal-bar">
      <div class="terminal-dots"><span></span><span></span><span></span></div>
      <div class="terminal-path">~/codenpost — auth</div>
    </div>
    <div class="terminal-body">
      <h1 id="formTitle">Log In</h1>
      <p class="subtitle">turn your commits into content</p>

      <div id="errorBox" class="error"></div>

      <div id="nameField" style="display:none">
        <label for="nameInput">name</label>
        <input type="text" id="nameInput" placeholder="Ada Lovelace" />
      </div>

      <label for="emailInput">email</label>
      <input type="email" id="emailInput" placeholder="you@example.com" />

      <label for="passwordInput">password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" />

      <button id="submitBtn">log in →</button>

      <p class="helper-text" style="margin-top:16px;">
        <span id="toggleText">no account yet?</span>
        <span class="link" id="toggleLink">sign up</span>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
